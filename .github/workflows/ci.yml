name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: core (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: clippy (server-only)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: test (unit)
        run: cargo test --locked --lib --all-features
      - name: test (replay throughput)
        run: cargo test --locked --test replay_throughput -- --nocapture

  fuse:
    name: fuse (real mount)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install fuse3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fuse3
          sudo rm -f /usr/local/bin/fusermount3
          echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: Preflight FUSE
        run: |
          set -euo pipefail
          ls -l /dev/fuse
          command -v fusermount3
          fusermount3 --version
      - name: Mount tests (src/fuse/sqlite.rs)
        env:
          SYNCMOUNT_REQUIRE_FUSE: "1"
        run: cargo test --locked --lib --features fuse-tests mount_tests -- --nocapture
      - name: End-to-end tests
        env:
          SYNCMOUNT_REQUIRE_FUSE: "1"
          FUSERMOUNT_PATH: /usr/bin/fusermount3
        run: cargo test --locked --test e2e_sqlite -- --test-threads=1 --nocapture
      - name: Round-trip tests
        env:
          SYNCMOUNT_REQUIRE_FUSE: "1"
          FUSERMOUNT_PATH: /usr/bin/fusermount3
        run: cargo test --locked --test rtt_blackhole -- --test-threads=1 --nocapture

  msrv:
    name: msrv 1.85.0 / musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: check (all targets)
        run: cargo +1.85.0 check --locked --all-targets --all-features
      - name: build (host)
        run: cargo +1.85.0 build --locked --profile dist
      - name: build (musl static)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo +1.85.0 build --locked --profile dist --target x86_64-unknown-linux-musl
      - name: Assert static binary
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/dist/syncmount
          file "$bin"
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "ERROR: binary is dynamically linked" >&2
            exit 1
          fi
          if readelf -d "$bin" | grep -q NEEDED; then
            echo "ERROR: binary has dynamic NEEDED entries" >&2
            exit 1
          fi
          size=$(stat -c%s "$bin")
          echo "size: $size bytes"
          test "$size" -lt $((15 * 1024 * 1024))
          "$bin" --version
