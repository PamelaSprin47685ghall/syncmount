name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    name: musl release asset
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build static binary
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo +1.85.0 build --locked --profile dist --target "$TARGET"

      - name: Assert static, versioned and below 15 MiB
        run: |
          set -eu
          bin="target/${TARGET}/dist/syncmount"
          test -x "$bin"
          file "$bin"
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "ERROR: binary is dynamically linked" >&2
            exit 1
          fi
          if readelf -d "$bin" | grep -q NEEDED; then
            echo "ERROR: binary has dynamic NEEDED entries" >&2
            exit 1
          fi
          size=$(stat -c%s "$bin")
          echo "size: $size bytes"
          test "$size" -lt $((15 * 1024 * 1024))
          "$bin" --version
          "$bin" --help

      - name: Third-party licence inventory
        run: |
          set -eu
          {
            echo "# Third-party licences"
            echo
            echo "Direct and transitive crates of the release build, from Cargo.lock."
            echo
            echo "| crate | version | licence |"
            echo "|---|---|---|"
            cargo +1.85.0 metadata --locked --format-version 1 \
              | jq -r '.packages[] | select(.source != null)
                       | "| \(.name) | \(.version) | \(.license // "UNKNOWN") |"' \
              | sort -u
          } > THIRD-PARTY-LICENSES.md

      - name: Stage the release tarball
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="syncmount-${version}-${TARGET}"
          mkdir -p "stage/${name}/examples"
          install -m 0755 "target/${TARGET}/dist/syncmount" "stage/${name}/syncmount"
          install -m 0644 man/syncmount.1 "stage/${name}/syncmount.1"
          install -m 0644 README.md "stage/${name}/README.md"
          install -m 0644 LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.md "stage/${name}/"
          install -m 0755 examples/*.sh "stage/${name}/examples/"
          tar -C "stage/${name}" -czf "stage/${name}.tar.gz" .
          (
            cd stage
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            sha256sum -c "${name}.tar.gz.sha256"
            tar -tzf "${name}.tar.gz"
          )
          echo "ASSET=stage/${name}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=stage/${name}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$CHECKSUM" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" "$CHECKSUM" \
              --title "syncmount $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
