name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: gate (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Tag matches the Cargo version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "syncmount") | .version')
          echo "tag: $tag, Cargo.toml: $version"
          test "$tag" = "$version"
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: clippy (server-only)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: test (unit)
        run: cargo test --locked --lib --all-features
      - name: test (replay throughput)
        run: cargo test --locked --test replay_throughput -- --nocapture

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl C toolchain (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - name: Install musl C toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://musl.cc/aarch64-linux-musl-cross.tgz \
            -o "$RUNNER_TEMP/aarch64-linux-musl-cross.tgz"
          tar -xzf "$RUNNER_TEMP/aarch64-linux-musl-cross.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" --version
          echo "$RUNNER_TEMP/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      - name: Build static binary
        env:
          CARGO_INCREMENTAL: "0"
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
        run: cargo +1.85.0 build --locked --profile dist --target "$TARGET"

      - name: Assert static and below 15 MiB
        run: |
          set -euo pipefail
          bin="target/${TARGET}/dist/syncmount"
          test -x "$bin"
          file "$bin"
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "ERROR: binary is dynamically linked" >&2
            exit 1
          fi
          if readelf -d "$bin" | grep -q NEEDED; then
            echo "ERROR: binary has dynamic NEEDED entries" >&2
            exit 1
          fi
          size=$(stat -c%s "$bin")
          echo "size: $size bytes"
          test "$size" -lt $((15 * 1024 * 1024))
          readelf -h "$bin" | grep -E 'Class:|Machine:'
          if [ "$TARGET" = "x86_64-unknown-linux-musl" ]; then
            "$bin" --version
            "$bin" --help
          fi

      - name: Third-party licence inventory
        run: |
          set -euo pipefail
          {
            echo "# Third-party licences"
            echo
            echo "Direct and transitive crates of the release build, from Cargo.lock."
            echo
            echo "| crate | version | licence |"
            echo "|---|---|---|"
            cargo +1.85.0 metadata --locked --format-version 1 \
              | jq -r '.packages[] | select(.source != null)
                       | "| \(.name) | \(.version) | \(.license // "UNKNOWN") |"' \
              | sort -u
          } > THIRD-PARTY-LICENSES.md

      - name: Stage the release tarball
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="syncmount-${version}-${TARGET}"
          mkdir -p "stage/${name}/examples"
          install -m 0755 "target/${TARGET}/dist/syncmount" "stage/${name}/syncmount"
          install -m 0644 man/syncmount.1 "stage/${name}/syncmount.1"
          install -m 0644 README.md "stage/${name}/README.md"
          install -m 0644 LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.md "stage/${name}/"
          install -m 0755 examples/*.sh "stage/${name}/examples/"
          tar -C "stage/${name}" -czf "stage/${name}.tar.gz" .
          (
            cd stage
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            sha256sum -c "${name}.tar.gz.sha256"
            tar -tzf "${name}.tar.gz"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            stage/*.tar.gz
            stage/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: stage

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd stage
          ls -l
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(stage/*.tar.gz stage/*.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "syncmount $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
