[package]
name = "syncmount"
version = "1.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Server-authoritative encrypted FUSE filesystem; the server holds the master key"
repository = "https://github.com/PamelaSprin47685ghall/syncmount"
readme = "README.md"
keywords = ["fuse", "filesystem", "sync", "encryption"]
categories = ["filesystem", "network-programming"]
publish = false

[lib]
name = "syncmount"
path = "src/lib.rs"

[[bin]]
name = "syncmount"
path = "src/bin/syncmount.rs"

[[test]]
name = "mmap_integration"
required-features = ["mmap-tests"]

[[test]]
name = "mmap_lock"
required-features = ["mmap-tests"]

[[test]]
name = "mmap_compat"
required-features = ["mmap-tests"]

[[test]]
name = "e2e_mmap"
required-features = ["mmap-tests"]

[[test]]
name = "chaos_mmap"
required-features = ["mmap-tests", "chaos-tests"]

[[test]]
name = "mmap_recovery"
required-features = ["mmap-tests", "slow-tests"]

[[test]]
name = "mmap_perf"
required-features = ["mmap-tests"]

[[test]]
name = "delta_vectors"
required-features = ["mmap-tests"]

[[test]]
name = "delta_property"
required-features = ["mmap-tests"]

[[test]]
name = "delta_wire_budget"
required-features = ["mmap-tests"]

[[test]]
name = "mmap_multihost"
required-features = ["mmap-tests"]

[features]
default = ["reduced-round", "fuse"]

# Wire algorithm: on = ChaCha8-Poly1305 (alg=0); off = ChaCha20-Poly1305 (alg=1).
reduced-round = ["chacha20poly1305/reduced-round"]

# FUSE client; turn off to build a server-only binary.
fuse = ["dep:fuser"]

# FUSE integration tests; require a mounted filesystem.
fuse-tests = ["fuse"]

slow-tests = []

# 1.1 mmap unit tests. Kept out of the default build so 1.0 tests are untouched.
mmap-tests = ["fuse"]

# Crash/fault-injection tests; opt-in only.
chaos-tests = []

# Disable blake3's C/asm build; slower, but needs no host C compiler.
pure-blake3 = ["blake3/pure"]

[dependencies]
# --- protocol (sans-io; no tokio/hyper/fuser/serde) ---
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
blake3 = "1.8.7"
zeroize = { version = "1.9.1", features = ["derive"] }
subtle = "2.6.1"
rand_core = { version = "0.10.0", default-features = false }

# --- process / entropy / IDs ---
rand = "0.10.3"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }

# --- local persistence (local only, never on the wire) ---
serde = { version = "1.0.229", features = ["derive"] }
bincode = { version = "=2.0.1", features = ["serde"] }
serde_json = "1.0.154"
# Shared client/server state store. `bundled` compiles the SQLite C source in,
# so the runtime has no libsqlite3 dependency. Exact pin: the on-disk format is
# a compatibility contract between both ends.
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled"] }

# --- HTTP/1.1 dual stream ---
tokio = { version = "1.54.1", features = [
    "rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal",
] }
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.5.0"
bytes = { version = "1.12.1", features = ["serde"] }

# --- FUSE (pure-Rust mount; never enable libfuse/libfuse2/libfuse3) ---
fuser = { version = "=0.18.0", optional = true, default-features = false }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "mount", "process", "net"] }

# --- CLI / logging / errors ---
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
rpassword = "7.5.4"
hex = "0.4.3"
thiserror = "2.0.21"
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "=1.11.0"
criterion = "=0.7.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "=3.5.0"
wait-timeout = "0.2.1"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
debug = 1
strip = "none"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
lto = "thin"
debug = true

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
